<h2>命令模式</h2>
<blockquote>
<p>命令模式（Command Pattern）是一种数据驱动的设计模式，请求以命令的形式包裹在对象中，并传给调用对象。调用对象寻找可以处理该命令的合适的对象，并把该命令传给相应的对象，该对象执行命令。将请求和执行分开操作</p>
<p><strong>将命令的请求者与执行者分开</strong></p>
