<h2>组合模式(Composite Pattern)</h2>
<blockquote>
<p><strong>部分整体模式,采用树形结构将一组类似的对象组合成一个整体</strong></p>
<p>将对象组合成树形结构以表示__部分-整体__的层次结构,使得用户对单个对象和组合对象的使用__具有一致性__</p>
<ul>
<li>使用单个对象表示一对多关系(树形结构)</li>
</ul>
